# Berechnet alle 15 Minuten Kurse, Bewertungen und Markt-Index und legt das Ergebnis
# als snapshot.json im Zweig "data" ab. Die Website lädt nur noch diese Datei.
name: Daten berechnen

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Die Erfolgskontrolle (track.json) wächst von Lauf zu Lauf. Schlägt das Holen fehl, bricht der Lauf ab –
      # sonst würde die bisherige Messung überschrieben. Fehlt nur die Datei, beginnt die Messung neu.
      - name: Bisherige Erfolgskontrolle holen
        run: |
          mkdir -p out
          git fetch --depth 1 origin data
          git show FETCH_HEAD:track.json > out/track.json 2>/dev/null || rm -f out/track.json
      - name: Berechnen
        run: node scripts/snapshot.mjs out/snapshot.json
        env:
          # Optional: eigener Schlüssel von coinmarketcap.com/api – dann zeigt die Seite zusätzlich deren Fear & Greed Index
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      - name: Im Zweig "data" ablegen
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json track.json lite.json
          git commit -q -m "Daten vom $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
