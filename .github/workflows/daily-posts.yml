# Postet jeden Morgen den Wetterbericht des Kryptomarkts mit 4 Bildern auf allen eingerichteten Kanälen
# (scripts/post-daily.mjs). Ein Kanal ist aktiv, sobald seine Geheimnisse hinterlegt sind – siehe SOCIAL-MEDIA.md.
name: Tägliche Beiträge

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC = 07:30 Uhr Schweizer Sommerzeit, 06:30 Uhr im Winter (GitHub startet oft etwas später)
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diese Kanäle (z. B. Facebook,Instagram oder Instagram-Reel,Facebook-Reel). Leer = alle."
        required: false
        default: ""
      check:
        description: "Nur den Facebook-/Instagram-Zugang prüfen, nichts posten"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POST_LANG: ${{ vars.POST_LANG }}
      ONLY: ${{ github.event.inputs.only }}
      CHECK: ${{ github.event.inputs.check == 'true' }}
      HAS_INSTAGRAM: ${{ secrets.INSTAGRAM_USER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bildbibliothek installieren
        run: npm install --no-save --silent sharp@0.33.5
      # ffmpeg baut das tägliche Reel aus den Bildern
      - name: Videowerkzeug bereitstellen
        if: env.CHECK != 'true'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Zugang prüfen (ohne zu posten)
        if: env.CHECK == 'true'
        run: node scripts/post-daily.mjs --check
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      # Der Tagesstand wird gespeichert, damit Text und Bilder sicher zusammenpassen
      - name: Bilder erzeugen
        if: env.CHECK != 'true'
        run: node scripts/post-daily.mjs --dry --images out --save-data today.json --video out/reel.mp4 && ffprobe -v error -show_entries format=duration,size -of compact out/reel.mp4
      - name: Bilder zum Ansehen ablegen
        if: env.CHECK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tagesbilder
          path: |
            out/*.jpg
            out/reel.mp4
          retention-days: 7
      # Instagram holt die Bilder von öffentlichen Adressen: Sie liegen dafür im Zweig "media"
      - name: Bilder für Instagram bereitstellen
        if: env.CHECK != 'true' && env.HAS_INSTAGRAM == 'true'
        run: |
          stamp="$(date -u +%Y%m%d-%H%M)"
          cd out
          for f in slide-*.jpg; do mv "$f" "$stamp-${f#slide-}"; done
          cp reel.mp4 "$stamp-reel.mp4"
          git init -q -b media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.jpg "$stamp-reel.mp4" && git commit -q -m "Bilder vom $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          echo "IMAGE_BASE=https://raw.githubusercontent.com/${{ github.repository }}/media/$stamp-" >> "$GITHUB_ENV"
          echo "REEL_URL=https://raw.githubusercontent.com/${{ github.repository }}/media/$stamp-reel.mp4" >> "$GITHUB_ENV"
          sleep 10
      - name: Posten
        if: env.CHECK != 'true'
        run: node scripts/post-daily.mjs
        env:
          DATA_FILE: today.json
          REEL_FILE: out/reel.mp4
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
